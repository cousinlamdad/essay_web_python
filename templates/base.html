<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <title>{{ t('app.title') }}</title>
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1>{{ t('app.title') }}</h1>
        <nav>
          <a href="{{ url_for('essay_list') }}">{{ t('nav.list') }}</a>
          <a href="{{ url_for('input_essay') }}">{{ t('nav.input') }}</a>
          <a class="lang-toggle" href="{{ url_for('set_language', lang='zh' if lang == 'en' else 'en', next=request.path) }}">{{ '中文' if lang == 'en' else 'EN' }}</a>
        </nav>
      </header>
      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
